[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maap-client"
version = "0.3.0"
description = "Python client for ESA MAAP satellite data access (EarthCARE, Aeolus, Biomass, FLEX, CryoSat)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Bernat"}
]
keywords = ["esa", "maap", "earthcare", "aeolus", "biomass", "flex", "cryosat", "stac", "satellite", "remote-sensing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "requests>=2.28",
    "pystac-client>=0.6",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff",
    "black",
]

[project.urls]
Homepage = "https://github.com/earthfocus/maap_client"
Issues = "https://github.com/earthfocus/maap_client/issues"

[project.scripts]
maap = "maap_client.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["maap_client*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
